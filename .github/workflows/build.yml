name: Build APK
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace --info > build.log 2>&1
          code=$?
          echo "Gradle exit code: $code" >> build.log
          cat build.log
          exit $code
      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-build-log
          path: build.log
      - name: Fail job when build failed
        if: steps.build.outcome != 'success'
        run: exit 1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: automatic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
